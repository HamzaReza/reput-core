version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: reput_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reput_db
      POSTGRES_USER: reput_user
      POSTGRES_PASSWORD: reput_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reput_user -d reput_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./repute-api
      dockerfile: Dockerfile
    container_name: reput_api
    restart: unless-stopped
    env_file: ./repute-api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://reput_user:reput_pass@db:5432/reput_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./repute-api:/app

  # ── pgAdmin (Database UI) ───────────────────────────────────────────────────
  # Note: servers.json is only applied on FIRST start (empty pgadmin volume).
  # If "RepuTrust DB" is missing, add the server manually (Host must be "db", not localhost)
  # or: docker compose stop pgadmin && docker volume rm reput-projects_pgadmin_data && docker compose up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reput_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@reputtrust.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json


volumes:
  postgres_data:
  pgadmin_data:
